name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libice6 \
            libnss3 \
            libopengl0 \
            libsm6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb1 \
            libxext6 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxrender1

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Compile Python sources
        run: |
          python -m py_compile \
            main.py \
            about_dialog.py \
            options_dialog.py \
            components_dialog.py \
            core/*.py

      - name: Run offscreen self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --self-test
