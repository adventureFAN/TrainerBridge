<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23272e"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad42"/>
      <stop offset="1" stop-color="#f06a18"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="#353b44" stroke-width="6"/>

  <!-- Bridge deck -->
  <path d="M92 342 H420" fill="none" stroke="#d8dde5" stroke-width="30" stroke-linecap="round"/>
  <path d="M111 342 V392 M177 342 V392 M243 342 V392 M309 342 V392 M375 342 V392"
        fill="none" stroke="#89929f" stroke-width="20" stroke-linecap="round"/>

  <!-- Main bridge arch -->
  <path d="M95 330 C140 184 372 184 417 330"
        fill="none" stroke="url(#orange)" stroke-width="34" stroke-linecap="round"/>
  <path d="M124 315 C172 228 340 228 388 315"
        fill="none" stroke="#20242a" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- Suspension cables -->
  <path d="M160 257 V330 M224 224 V330 M288 224 V330 M352 257 V330"
        fill="none" stroke="#ffb256" stroke-width="10" stroke-linecap="round"/>

  <!-- Controller integrated above bridge -->
  <path d="M168 162 C178 126 211 106 256 106 C301 106 334 126 344 162
           L365 236 C371 258 351 278 330 267 L289 245 H223 L182 267
           C161 278 141 258 147 236 Z"
        fill="#f58220" stroke="#ffb24e" stroke-width="8" stroke-linejoin="round"/>

  <!-- D-pad -->
  <path d="M199 164 H219 V144 H239 V164 H259 V184 H239 V204 H219 V184 H199 Z"
        fill="#20242a"/>

  <!-- Buttons -->
  <circle cx="309" cy="160" r="12" fill="#20242a"/>
  <circle cx="333" cy="185" r="12" fill="#20242a"/>

  <!-- Link/bridge spark -->
  <circle cx="256" cy="338" r="19" fill="#ff9b2f" stroke="#fff0d8" stroke-width="7"/>
</svg>
