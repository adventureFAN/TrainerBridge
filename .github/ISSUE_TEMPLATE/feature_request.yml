name: Feature request
description: Suggest an improvement for TrainerBridge
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the problem rather than only the requested implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request is related to launching or managing standalone Windows trainers under Steam Proton.
          required: true
        - label: This request does not ask TrainerBridge to bypass anti-cheat or support online cheating.
          required: true
